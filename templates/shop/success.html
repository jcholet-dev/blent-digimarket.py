<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiMarket - Commande validée</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 min-h-full flex flex-col antialiased">

    {% include 'shop/topbar.html' %}

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-20 flex-1 w-full flex items-center justify-center">
        <div class="bg-white rounded-3xl p-10 shadow-sm border border-slate-200/80 text-center space-y-6 w-full">
            <div class="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
                ✓
            </div>

            <div class="space-y-2">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Merci pour votre commande !</h1>
                <p class="text-sm text-slate-500">Votre commande n°<strong class="text-slate-700">{{ order_id }}</strong> a été enregistrée avec succès.</p>
            </div>

            <div class="pt-6 border-t border-slate-100 flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/api/shop/" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-sm">
                    Retourner à la boutique
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 text-center text-sm text-slate-500 mt-auto">
        <p>&copy; 2026 DigiMarket. Tous droits réservés.</p>
    </footer>
</body>
</html>
