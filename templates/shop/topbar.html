<header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-black tracking-tight text-indigo-600">DigiMarket</span>
        </div>
        <div class="flex items-center space-x-6">
            <a href="/api/shop/cart" class="text-slate-600 hover:text-indigo-600 font-medium flex items-center space-x-1.5 transition-colors relative">
                <span class="text-lg">🛒</span>
                <span>Panier</span>
                <span id="cart-badge" class="ml-1 px-2 py-0.5 text-xs bg-indigo-100 text-indigo-700 rounded-full font-bold">
                    {{ cart_count }}
                </span>
            </a>

            <div class="flex items-center space-x-4">
                <!-- Lien vers l'historique des commandes -->
                <a href="#" onclick="goToOrders(event)" class="text-sm text-slate-600 hover:text-indigo-600 font-medium transition-colors">Mes commandes</a>
                <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800 font-medium">Déconnexion</button>
            </div>
        </div>
    </div>
</header>
<!-- Remplace le lien direct par un appel JavaScript -->

<script>
    async function goToOrders(event) {
        event.preventDefault();
        const token = localStorage.getItem('access_token');

        // 1. Vérification visuelle immédiate
        console.log("Token dans localStorage :", token);

        if (!token || token === "null" || token === "undefined") {
            alert("Erreur : Aucun token JWT trouvé. Veuillez vous reconnecter.");
            window.location.href = '/'; // Redirige vers la page de login
            return;
        }

        try {
            const response = await fetch('/api/shop/orders', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const html = await response.text();
                document.open();
                document.write(html);
                document.close();
            } else {
                const errorData = await response.json().catch(() => ({}));
                console.error("Détail de l'erreur 401 :", errorData);
                alert("Session expirée ou non autorisée (401). Reconnectez-vous.");
                localStorage.removeItem('access_token');
                window.location.href = '/';
            }
        } catch (error) {
            console.error("Erreur réseau :", error);
        }
    }

    function logout() {
        localStorage.removeItem('access_token');
        localStorage.removeItem('role');
        window.location.href = '/';
    }
</script>
